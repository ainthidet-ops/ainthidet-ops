<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ระบบบริหารสื่อและเทคโนโลยีโรงเรียน">

<title>ระบบบริหารสื่อและเทคโนโลยีโรงเรียน</title>

<style>
:root{
  --bg:#f7f7f7;
  --text:#111;
  --muted:#666;
  --accent:#000;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  color:var(--text);
  font-family:"Noto Sans Thai",sans-serif;
}

.loader-screen{
  text-align:center;
  max-width:500px;
  padding:40px;
}

.logo{
  font-size:48px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:10px;
}

.brand{
  font-size:14px;
  font-weight:600;
  letter-spacing:3px;
  color:var(--muted);
  margin-bottom:40px;
}

h1{
  font-size:32px;
  margin-bottom:12px;
}

p{
  color:var(--muted);
  line-height:1.7;
}

.spinner{
  width:56px;
  height:56px;
  margin:32px auto;
  border:4px solid #ddd;
  border-top:4px solid #000;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

.status{
  margin-top:16px;
  font-size:14px;
  color:var(--muted);
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}
</style>

<script>
window.onload = function () {

  document.getElementById("status").textContent =
    "กำลังเชื่อมต่อฐานข้อมูลกลาง...";

  setTimeout(function () {
    window.location.href =
      "https://script.google.com/macros/s/AKfycbwaB3KIoLHwffMDI3dN6mPZG7gOxUEqqUvVTpWsLIZpjancgneMMUw5rghf428R9Eu5/exec";
  }, 2000);

};
</script>

</head>

<body>

<div class="loader-screen">

  <div class="logo">M</div>

  <div class="brand">
    MEDIA SCHOOL TECHNOLOGY
  </div>

  <h1>ระบบบริหารสื่อและเทคโนโลยีโรงเรียน</h1>

  <p>
    ทะเบียนอุปกรณ์ การสำรวจ และติดตามงานซ่อม
  </p>

  <div class="spinner"></div>

  <div id="status" class="status">
    กำลังเตรียมระบบ...
  </div>

</div>

</body>
</html>
